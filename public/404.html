<!doctype html><html><head><meta charset="utf-8"><title>Redirecting…</title>
    <script>
      // Amplify staging fix: Supabase recovery/invite links can land on the site root
      // (#access_token=...&type=recovery). supabase-js would consume the hash and the
      // app would skip the set-password step. Route them to set-password before boot.
      (function () {
        try {
          var h = window.location.hash || "";
          if (h.indexOf("access_token=") === -1) { window.location.replace("/"); return; }
          var p = new URLSearchParams(h.substring(1));
          var type = p.get("type");
          var at = p.get("access_token");
          var rt = p.get("refresh_token");
          if ((type === "recovery" || type === "invite") && at && rt) {
            window.location.replace(
              "/#/set-password?access_token=" + encodeURIComponent(at) +
                "&refresh_token=" + encodeURIComponent(rt) + "&type=" + type,
            );
          }
        } catch (e) {}
      })();
    </script>
</head><body></body></html>
